# DMOI POC subset selection (Week-1 Day-3 actuals):
#   H+ (luminal):  PAM50 in {LumA, LumB} AND ER positive       -> 547 patients
#   H- (basal/TN): PAM50 = Basal AND ER/PR/HER2 all negative   -> 103 patients
#   Total cohort: 650 patients
#   With both modalities (RNA + methylation): 395 patients (DMOI dual-modality training set)
#   See audit/cohort_summary.md for details; reproduce with: python scripts/build_cohort.py
