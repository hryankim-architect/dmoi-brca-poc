# DMOI POC data manifest — TCGA-BRCA 2-modality dataset.
#
# Source: UCSC Xena Hub (https://xenabrowser.net) — TCGA.BRCA.sampleMap project.
# Datasets are pre-normalized + matched across modalities at the sample level.

inputs:
  - url: https://tcga-xena-hub.s3.us-east-1.amazonaws.com/download/TCGA.BRCA.sampleMap%2FHiSeqV2.gz
    path: tcga_brca/HiSeqV2.gz
    sha256: TBD-after-Day2-download
    size_mb: 25
    license: NIH GDC Data Use Agreement (open tier) / UCSC Xena distribution
    source: "RNA-seq HiSeqV2 Polya+ FPKM, log2(x+1) normalized. ~1100 BRCA samples."

  - url: https://tcga-xena-hub.s3.us-east-1.amazonaws.com/download/TCGA.BRCA.sampleMap%2FHumanMethylation450.gz
    path: tcga_brca/HumanMethylation450.gz
    sha256: TBD-after-Day2-download
    size_mb: 700
    license: NIH GDC Data Use Agreement (open tier) / UCSC Xena distribution
    source: "Illumina HumanMethylation450 beta values. ~785 BRCA samples with HM450 coverage."

  - url: https://tcga-xena-hub.s3.us-east-1.amazonaws.com/download/TCGA.BRCA.sampleMap%2FBRCA_clinicalMatrix
    path: tcga_brca/BRCA_clinicalMatrix.tsv
    sha256: TBD-after-Day2-download
    size_mb: 2
    license: NIH GDC Data Use Agreement (open tier) / UCSC Xena distribution
    source: "TCGA-BRCA clinical phenotype matrix. ER/PR/HER2 status, PAM50 subtype, OS/PFS."

# DMOI POC subset selection (Week-1 Day-3):
#   ER+ luminal A/B  ~700 patients (H+ pole)
#   Triple-negative basal-like ~200 patients (H- pole)
#   Both modalities required (RNA-seq + methylation intersection)
